name: DCT Full Stack Validation

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-frontend:
    name: Validate Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check site files
        run: |
          test -f dope-cloud-teacher/index.html
          find dope-cloud-teacher -name "*.html" -type f -print | head -30
          echo "Frontend source files found."

  test-backend:
    name: Validate Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install backend dependencies
        run: npm install
      - name: Check server syntax
        run: node --check server.js
      - name: Initialize disposable CI database
        run: npm run init-db
      - name: Verify disposable CI database
        run: npm run check-db

  summary:
    name: Deployment Ownership
    needs: [test-frontend, test-backend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Document the production deployment path
        run: |
          echo "## DCT deployment ownership" >> "$GITHUB_STEP_SUMMARY"
          echo "Frontend: Azure Static Web Apps deploys from the separate Azure workflow." >> "$GITHUB_STEP_SUMMARY"
          echo "Backend: Railway auto-deploys the existing energetic-endurance service from main (backend root)." >> "$GITHUB_STEP_SUMMARY"
          echo "This workflow validates source code; it does not deploy, replace tokens, or modify production databases." >> "$GITHUB_STEP_SUMMARY"
          echo "Frontend check: ${{ needs.test-frontend.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Backend check: ${{ needs.test-backend.result }}" >> "$GITHUB_STEP_SUMMARY"
