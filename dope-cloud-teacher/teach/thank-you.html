<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Application Received | The Dope Cloud TeacHer</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="../logo.svg?v=20260705c">
  <link rel="stylesheet" href="styles.css">
  <style>
    .confirmation { min-height: calc(100vh - 190px); display: grid; place-items: center; padding: 64px 0; }
    .confirmation-card { max-width: 760px; padding: clamp(34px, 7vw, 72px); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); text-align: center; }
    .confirmation-mark { width: 64px; height: 64px; display: grid; place-items: center; margin: 0 auto 26px; border-radius: 50%; background: var(--purple); color: #fff; font-size: 30px; font-weight: 800; }
    .confirmation-card h1 { font-size: clamp(38px, 6vw, 62px); }
    .confirmation-card p { margin: 24px auto 0; max-width: 580px; color: var(--muted); font-size: 18px; line-height: 1.65; }
    .confirmation-card .button { margin-top: 30px; }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="../index.html" aria-label="The Dope Cloud TeacHer home"><img src="../logo.svg?v=20260705c" alt="The Dope Cloud TeacHer"></a>
    <a class="back-link" href="../index.html">Back to DCT</a>
  </header>
  <main class="confirmation">
    <section class="confirmation-card">
      <div class="confirmation-mark" aria-hidden="true">✓</div>
      <p class="section-label">Application received</p>
      <h1>Thank you for your interest in DCT.</h1>
      <p>Our team will review your application and contact selected candidates regarding next steps. We appreciate the time, experience, and intention you put into applying.</p>
      <a class="button primary" href="../index.html">Return to The Dope Cloud TeacHer</a>
    </section>
  </main>
</body>
</html>
