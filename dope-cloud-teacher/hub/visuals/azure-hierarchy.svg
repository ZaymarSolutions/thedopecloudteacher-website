<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="t_azure-hierarchy"><title id="t_azure-hierarchy">Management groups contain subscriptions, which contain resource groups and resources</title>
<style>
 text{font-family:'Source Sans 3', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;fill:#0B0B12}
