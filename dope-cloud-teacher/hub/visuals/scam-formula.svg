<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-labelledby="t_scam-formula"><title id="t_scam-formula">Scam formula: urgency plus emotion plus unusual payment equals stop</title>
<style>
 text{font-family:'Source Sans 3', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;fill:#0B0B12}
 .t{font-size:15px;font-weight:600} .s{font-size:12px;fill:#354150} .h{font-size:20px;font-weight:800}
 .k{font-size:11px;letter-spacing:1.5px;font-weight:700;fill:#354150} .w{fill:#fff}
 .flow{stroke-dasharray:6 6;animation:dash 1.4s linear infinite}
 .pulse{animation:pulse 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
 @keyframes dash{to{stroke-dashoffset:-24}}
 @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.75;transform:scale(1.04)}}
 @keyframes rise{from{opacity:.15;transform:translateY(6px)}to{opacity:1;transform:none}}
 @media (prefers-reduced-motion: reduce){.flow,.pulse,.rise{animation:none}}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#354150"/></marker></defs><rect x="0" y="0" width="900" height="260" rx="18" fill="#ffffff"/><rect x="0.5" y="0.5" width="899" height="259" rx="18" fill="none" stroke="#d9e7f7"/><text x="28" y="34.0" class="k" text-anchor="start" dominant-baseline="middle">SPOT THE TRICK</text><text x="28" y="60.0" class="h" text-anchor="start" dominant-baseline="middle">The scam formula</text><g><rect x="40" y="110" width="190" height="90" rx="12" fill="#3f94e9" stroke="#3f94e9" stroke-width="1.5"/><text x="135.0" y="146.0" class="t" text-anchor="middle" dominant-baseline="middle" style="fill:#fff">Urgency</text><text x="135.0" y="167.0" class="s" text-anchor="middle" dominant-baseline="middle" style="fill:#eaf0ff">act now!</text></g><text x="250" y="155.0" class="h" text-anchor="middle" dominant-baseline="middle">+</text><g><rect x="270" y="110" width="190" height="90" rx="12" fill="#1267cf" stroke="#1267cf" stroke-width="1.5"/><text x="365.0" y="146.0" class="t" text-anchor="middle" dominant-baseline="middle" style="fill:#fff">Emotion</text><text x="365.0" y="167.0" class="s" text-anchor="middle" dominant-baseline="middle" style="fill:#eaf0ff">fear · love · greed</text></g><text x="480" y="155.0" class="h" text-anchor="middle" dominant-baseline="middle">+</text><g><rect x="500" y="110" width="190" height="90" rx="12" fill="#12487e" stroke="#12487e" stroke-width="1.5"/><text x="595.0" y="146.0" class="t" text-anchor="middle" dominant-baseline="middle" style="fill:#fff">Unusual payment</text><text x="595.0" y="167.0" class="s" text-anchor="middle" dominant-baseline="middle" style="fill:#eaf0ff">gift cards · crypto · wires</text></g><text x="710" y="155.0" class="h" text-anchor="middle" dominant-baseline="middle">=</text><g class="pulse"><rect x="730" y="110" width="130" height="90" rx="14" fill="#c2352f"/><text x="795" y="155.0" class="h" text-anchor="middle" dominant-baseline="middle" style="fill:#fff">STOP</text></g></svg>