<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="t_llm-flow"><title id="t_llm-flow">How a language model generates an answer token by token</title>
<style>
 text{font-family:'Source Sans 3', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;fill:#0B0B12}
 .t{font-size:15px;font-weight:600} .s{font-size:12px;fill:#354150} .h{font-size:20px;font-weight:800}
 .k{font-size:11px;letter-spacing:1.5px;font-weight:700;fill:#354150} .w{fill:#fff}
 .flow{stroke-dasharray:6 6;animation:dash 1.4s linear infinite}
 .pulse{animation:pulse 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
 @keyframes dash{to{stroke-dashoffset:-24}}
 @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.75;transform:scale(1.04)}}
 @keyframes rise{from{opacity:.15;transform:translateY(6px)}to{opacity:1;transform:none}}
 @media (prefers-reduced-motion: reduce){.flow,.pulse,.rise{animation:none}}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#354150"/></marker></defs><rect x="0" y="0" width="900" height="300" rx="18" fill="#ffffff"/><rect x="0.5" y="0.5" width="899" height="299" rx="18" fill="none" stroke="#d9e7f7"/><text x="28" y="34.0" class="k" text-anchor="start" dominant-baseline="middle">HOW AI ANSWERS</text><text x="28" y="60.0" class="h" text-anchor="start" dominant-baseline="middle">Predict the next piece, again and again</text><g><rect x="30" y="120" width="150" height="80" rx="12" fill="#f5faff" stroke="#d9e7f7" stroke-width="1.5"/><text x="105.0" y="151.0" class="t" text-anchor="middle" dominant-baseline="middle">Your prompt</text><text x="105.0" y="172.0" class="s" text-anchor="middle" dominant-baseline="middle">words in</text></g><line x1="180" y1="160" x2="200" y2="160" stroke="#354150" stroke-width="2" marker-end="url(#ah)" class="flow"/><g><rect x="202" y="120" width="150" height="80" rx="12" fill="#f5faff" stroke="#d9e7f7" stroke-width="1.5"/><text x="277.0" y="151.0" class="t" text-anchor="middle" dominant-baseline="middle">Tokens</text><text x="277.0" y="172.0" class="s" text-anchor="middle" dominant-baseline="middle">chopped into pieces</text></g><line x1="352" y1="160" x2="372" y2="160" stroke="#354150" stroke-width="2" marker-end="url(#ah)" class="flow"/><g class="pulse"><rect x="374" y="120" width="150" height="80" rx="12" fill="#1267cf" stroke="#1267cf" stroke-width="1.5"/><text x="449.0" y="151.0" class="t" text-anchor="middle" dominant-baseline="middle" style="fill:#fff">Model</text><text x="449.0" y="172.0" class="s" text-anchor="middle" dominant-baseline="middle" style="fill:#eaf0ff">patterns from training</text></g><line x1="524" y1="160" x2="544" y2="160" stroke="#354150" stroke-width="2" marker-end="url(#ah)" class="flow"/><g><rect x="546" y="120" width="150" height="80" rx="12" fill="#f5faff" stroke="#d9e7f7" stroke-width="1.5"/><text x="621.0" y="151.0" class="t" text-anchor="middle" dominant-baseline="middle">Next-token guess</text><text x="621.0" y="172.0" class="s" text-anchor="middle" dominant-baseline="middle">most likely piece</text></g><line x1="696" y1="160" x2="716" y2="160" stroke="#354150" stroke-width="2" marker-end="url(#ah)" class="flow"/><g><rect x="718" y="120" width="150" height="80" rx="12" fill="#f5faff" stroke="#d9e7f7" stroke-width="1.5"/><text x="793.0" y="151.0" class="t" text-anchor="middle" dominant-baseline="middle">Answer</text><text x="793.0" y="172.0" class="s" text-anchor="middle" dominant-baseline="middle">words out</text></g><path d="M 677 205 C 677 250, 461 250, 461 205" fill="none" stroke="#1267cf" stroke-width="2" class="flow" marker-end="url(#ah)"/><text x="569" y="262.0" class="s" text-anchor="middle" dominant-baseline="middle">repeat until done · grounding adds trusted facts</text></svg>