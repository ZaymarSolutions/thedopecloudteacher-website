<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-labelledby="t_lb-choice"><title id="t_lb-choice">Comparison of Azure Load Balancer, Application Gateway, Front Door and Traffic Manager</title>
<style>
 text{font-family:'Source Sans 3', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;fill:#0B0B12}
 .t{font-size:15px;font-weight:600} .s{font-size:12px;fill:#354150} .h{font-size:20px;font-weight:800}
 .k{font-size:11px;letter-spacing:1.5px;font-weight:700;fill:#354150} .w{fill:#fff}
 .flow{stroke-dasharray:6 6;animation:dash 1.4s linear infinite}
 .pulse{animation:pulse 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
 @keyframes dash{to{stroke-dashoffset:-24}}
 @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.75;transform:scale(1.04)}}
 @keyframes rise{from{opacity:.15;transform:translateY(6px)}to{opacity:1;transform:none}}
 @media (prefers-reduced-motion: reduce){.flow,.pulse,.rise{animation:none}}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#354150"/></marker></defs><rect x="0" y="0" width="900" height="340" rx="18" fill="#ffffff"/><rect x="0.5" y="0.5" width="899" height="339" rx="18" fill="none" stroke="#d9e7f7"/><text x="28" y="34.0" class="k" text-anchor="start" dominant-baseline="middle">TRAFFIC</text><text x="28" y="60.0" class="h" text-anchor="start" dominant-baseline="middle">Which load balancer?</text><rect x="40" y="92" width="400" height="90" rx="14" fill="#1267cf" opacity=".12"/><circle cx="80" cy="137" r="18" fill="#1267cf" class="pulse"/><text x="112" y="126.0" class="t" text-anchor="start" dominant-baseline="middle">Azure Load Balancer</text><text x="112" y="150.0" class="s" text-anchor="start" dominant-baseline="middle">Layer 4 · regional · TCP/UDP</text><rect x="460" y="92" width="400" height="90" rx="14" fill="#102b48" opacity=".12"/><circle cx="500" cy="137" r="18" fill="#102b48" class="pulse"/><text x="532" y="126.0" class="t" text-anchor="start" dominant-baseline="middle">Application Gateway + WAF</text><text x="532" y="150.0" class="s" text-anchor="start" dominant-baseline="middle">Layer 7 · regional · path routing</text><rect x="40" y="202" width="400" height="90" rx="14" fill="#12487e" opacity=".12"/><circle cx="80" cy="247" r="18" fill="#12487e" class="pulse"/><text x="112" y="236.0" class="t" text-anchor="start" dominant-baseline="middle">Azure Front Door</text><text x="112" y="260.0" class="s" text-anchor="start" dominant-baseline="middle">Layer 7 · global · CDN + WAF</text><rect x="460" y="202" width="400" height="90" rx="14" fill="#3f94e9" opacity=".12"/><circle cx="500" cy="247" r="18" fill="#3f94e9" class="pulse"/><text x="532" y="236.0" class="t" text-anchor="start" dominant-baseline="middle">Traffic Manager</text><text x="532" y="260.0" class="s" text-anchor="start" dominant-baseline="middle">DNS · global · any protocol</text></svg>