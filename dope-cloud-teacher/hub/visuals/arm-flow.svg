<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="t_arm-flow"><title id="t_arm-flow">Azure Resource Manager receives all requests from portal, CLI, PowerShell, templates and SDKs</title>
