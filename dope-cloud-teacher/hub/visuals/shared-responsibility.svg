<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-labelledby="t_shared-responsibility"><title id="t_shared-responsibility">Shared responsibility model: what the customer and the provider each secure</title>
<style>
 text{font-family:'Source Sans 3', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;fill:#0B0B12}
 .t{font-size:15px;font-weight:600} .s{font-size:12px;fill:#354150} .h{font-size:20px;font-weight:800}
 .k{font-size:11px;letter-spacing:1.5px;font-weight:700;fill:#354150} .w{fill:#fff}
 .flow{stroke-dasharray:6 6;animation:dash 1.4s linear infinite}
 .pulse{animation:pulse 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
 @keyframes dash{to{stroke-dashoffset:-24}}
 @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.75;transform:scale(1.04)}}
 @keyframes rise{from{opacity:.15;transform:translateY(6px)}to{opacity:1;transform:none}}
 @media (prefers-reduced-motion: reduce){.flow,.pulse,.rise{animation:none}}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#354150"/></marker></defs><rect x="0" y="0" width="900" height="400" rx="18" fill="#ffffff"/><rect x="0.5" y="0.5" width="899" height="399" rx="18" fill="none" stroke="#d9e7f7"/><text x="28" y="34.0" class="k" text-anchor="start" dominant-baseline="middle">SHARED RESPONSIBILITY</text><text x="28" y="60.0" class="h" text-anchor="start" dominant-baseline="middle">Provider secures the cloud. You secure what&#x27;s in it.</text><g style="animation-delay:0.0s"><rect x="40" y="100" width="820" height="76" rx="14" fill="#3f94e9" opacity=".12"/><rect x="40" y="100" width="10" height="76" rx="5" fill="#3f94e9"/><text x="70" y="128.0" class="t" text-anchor="start" dominant-baseline="middle">Data, devices, accounts &amp; identities</text><text x="70" y="152.0" class="s" text-anchor="start" dominant-baseline="middle">Always you</text></g><g style="animation-delay:0.15s"><rect x="40" y="192" width="820" height="76" rx="14" fill="#12487e" opacity=".12"/><rect x="40" y="192" width="10" height="76" rx="5" fill="#12487e"/><text x="70" y="220.0" class="t" text-anchor="start" dominant-baseline="middle">Apps, OS, network controls, identity infrastructure</text><text x="70" y="244.0" class="s" text-anchor="start" dominant-baseline="middle">Depends on IaaS / PaaS / SaaS</text></g><g style="animation-delay:0.3s"><rect x="40" y="284" width="820" height="76" rx="14" fill="#1267cf" opacity=".12"/><rect x="40" y="284" width="10" height="76" rx="5" fill="#1267cf"/><text x="70" y="312.0" class="t" text-anchor="start" dominant-baseline="middle">Physical hosts, network &amp; datacenter</text><text x="70" y="336.0" class="s" text-anchor="start" dominant-baseline="middle">Always the provider</text></g><g class="pulse"><circle cx="800" cy="138" r="22" fill="#3f94e9"/><text x="800" y="138.0" class="k" text-anchor="middle" dominant-baseline="middle" style="fill:#fff">YOU</text></g></svg>