<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-labelledby="t_hub-spoke"><title id="t_hub-spoke">Hub and spoke network with shared firewall and gateways in the hub</title>
<style>
 text{font-family:'Source Sans 3', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;fill:#0B0B12}
 .t{font-size:15px;font-weight:600} .s{font-size:12px;fill:#354150} .h{font-size:20px;font-weight:800}
 .k{font-size:11px;letter-spacing:1.5px;font-weight:700;fill:#354150} .w{fill:#fff}
 .flow{stroke-dasharray:6 6;animation:dash 1.4s linear infinite}
 .pulse{animation:pulse 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
 @keyframes dash{to{stroke-dashoffset:-24}}
 @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.75;transform:scale(1.04)}}
 @keyframes rise{from{opacity:.15;transform:translateY(6px)}to{opacity:1;transform:none}}
 @media (prefers-reduced-motion: reduce){.flow,.pulse,.rise{animation:none}}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#354150"/></marker></defs><rect x="0" y="0" width="900" height="380" rx="18" fill="#ffffff"/><rect x="0.5" y="0.5" width="899" height="379" rx="18" fill="none" stroke="#d9e7f7"/><text x="28" y="34.0" class="k" text-anchor="start" dominant-baseline="middle">TOPOLOGY</text><text x="28" y="60.0" class="h" text-anchor="start" dominant-baseline="middle">Hub-and-spoke: shared services in the middle</text><g class="pulse"><circle cx="450" cy="215" r="88" fill="#1267cf"/></g><text x="450" y="195.0" class="t" text-anchor="middle" dominant-baseline="middle" style="fill:#fff">Hub VNet</text><text x="450" y="220.0" class="s" text-anchor="middle" dominant-baseline="middle" style="fill:#e8eeff">Firewall · Bastion</text><text x="450" y="240.0" class="s" text-anchor="middle" dominant-baseline="middle" style="fill:#e8eeff">VPN / ExpressRoute</text><line x1="324.0" y1="183.5" x2="210" y2="140" stroke="#354150" stroke-width="2" marker-end="url(#ah)" class="flow"/><g><rect x="60" y="110" width="120" height="60" rx="10" fill="#f5faff" stroke="#d9e7f7" stroke-width="1.5"/><text x="120.0" y="131.0" class="t" text-anchor="middle" dominant-baseline="middle">Spoke: Web</text><text x="120.0" y="152.0" class="s" text-anchor="middle" dominant-baseline="middle">peered</text></g><line x1="324.0" y1="250.7" x2="210" y2="300" stroke="#354150" stroke-width="2" marker-end="url(#ah)" class="flow"/><g><rect x="60" y="270" width="120" height="60" rx="10" fill="#f5faff" stroke="#d9e7f7" stroke-width="1.5"/><text x="120.0" y="291.0" class="t" text-anchor="middle" dominant-baseline="middle">Spoke: Data</text><text x="120.0" y="312.0" class="s" text-anchor="middle" dominant-baseline="middle">peered</text></g><line x1="576.0" y1="183.5" x2="690" y2="140" stroke="#354150" stroke-width="2" marker-end="url(#ah)" class="flow"/><g><rect x="720" y="110" width="120" height="60" rx="10" fill="#f5faff" stroke="#d9e7f7" stroke-width="1.5"/><text x="780.0" y="131.0" class="t" text-anchor="middle" dominant-baseline="middle">Spoke: Apps</text><text x="780.0" y="152.0" class="s" text-anchor="middle" dominant-baseline="middle">peered</text></g><line x1="576.0" y1="250.7" x2="690" y2="300" stroke="#354150" stroke-width="2" marker-end="url(#ah)" class="flow"/><g><rect x="720" y="270" width="120" height="60" rx="10" fill="#f5faff" stroke="#d9e7f7" stroke-width="1.5"/><text x="780.0" y="291.0" class="t" text-anchor="middle" dominant-baseline="middle">Spoke: Dev</text><text x="780.0" y="312.0" class="s" text-anchor="middle" dominant-baseline="middle">peered</text></g><text x="450" y="355.0" class="s" text-anchor="middle" dominant-baseline="middle">Peering is non-transitive: spokes talk through the hub&#x27;s firewall.</text></svg>