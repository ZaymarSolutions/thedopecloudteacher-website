<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-labelledby="t_monitor-flow"><title id="t_monitor-flow">Monitoring data flowing into Log Analytics then alerts, action groups and dashboards</title>
<style>
 text{font-family:'Source Sans 3', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;fill:#0B0B12}
 .t{font-size:15px;font-weight:600} .s{font-size:12px;fill:#354150} .h{font-size:20px;font-weight:800}
 .k{font-size:11px;letter-spacing:1.5px;font-weight:700;fill:#354150} .w{fill:#fff}
 .flow{stroke-dasharray:6 6;animation:dash 1.4s linear infinite}
 .pulse{animation:pulse 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
 @keyframes dash{to{stroke-dashoffset:-24}}
 @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.75;transform:scale(1.04)}}
 @keyframes rise{from{opacity:.15;transform:translateY(6px)}to{opacity:1;transform:none}}
 @media (prefers-reduced-motion: reduce){.flow,.pulse,.rise{animation:none}}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#354150"/></marker></defs><rect x="0" y="0" width="900" height="320" rx="18" fill="#ffffff"/><rect x="0.5" y="0.5" width="899" height="319" rx="18" fill="none" stroke="#d9e7f7"/><text x="28" y="34.0" class="k" text-anchor="start" dominant-baseline="middle">WATCH ACTIVITY</text><text x="28" y="60.0" class="h" text-anchor="start" dominant-baseline="middle">Signals in, decisions out</text><g><rect x="40" y="88" width="160" height="34" rx="8" fill="#f5faff" stroke="#d9e7f7" stroke-width="1.5"/><text x="120.0" y="105.0" class="t" text-anchor="middle" dominant-baseline="middle">Metrics</text></g><line x1="200" y1="105" x2="330" y2="190" stroke="#354150" stroke-width="2" marker-end="url(#ah)" class="flow"/><g><rect x="40" y="130" width="160" height="34" rx="8" fill="#f5faff" stroke="#d9e7f7" stroke-width="1.5"/><text x="120.0" y="147.0" class="t" text-anchor="middle" dominant-baseline="middle">Activity log</text></g><line x1="200" y1="147" x2="330" y2="190" stroke="#354150" stroke-width="2" marker-end="url(#ah)" class="flow"/><g><rect x="40" y="172" width="160" height="34" rx="8" fill="#f5faff" stroke="#d9e7f7" stroke-width="1.5"/><text x="120.0" y="189.0" class="t" text-anchor="middle" dominant-baseline="middle">Resource logs</text></g><line x1="200" y1="189" x2="330" y2="190" stroke="#354150" stroke-width="2" marker-end="url(#ah)" class="flow"/><g><rect x="40" y="214" width="160" height="34" rx="8" fill="#f5faff" stroke="#d9e7f7" stroke-width="1.5"/><text x="120.0" y="231.0" class="t" text-anchor="middle" dominant-baseline="middle">Sign-in logs</text></g><line x1="200" y1="231" x2="330" y2="190" stroke="#354150" stroke-width="2" marker-end="url(#ah)" class="flow"/><g><rect x="40" y="256" width="160" height="34" rx="8" fill="#f5faff" stroke="#d9e7f7" stroke-width="1.5"/><text x="120.0" y="273.0" class="t" text-anchor="middle" dominant-baseline="middle">App telemetry</text></g><line x1="200" y1="273" x2="330" y2="190" stroke="#354150" stroke-width="2" marker-end="url(#ah)" class="flow"/><g class="pulse"><rect x="332" y="140" width="210" height="100" rx="12" fill="#102b48" stroke="#102b48" stroke-width="1.5"/><text x="437.0" y="181.0" class="t" text-anchor="middle" dominant-baseline="middle" style="fill:#fff">Log Analytics</text><text x="437.0" y="202.0" class="s" text-anchor="middle" dominant-baseline="middle" style="fill:#eaf0ff">KQL · Sentinel · Insights</text></g><line x1="542" y1="190" x2="640" y2="110" stroke="#354150" stroke-width="2" marker-end="url(#ah)" class="flow"/><g><rect x="642" y="84" width="220" height="54" rx="12" fill="#f5faff" stroke="#d9e7f7" stroke-width="1.5"/><text x="752.0" y="102.0" class="t" text-anchor="middle" dominant-baseline="middle">Alert rule</text><text x="752.0" y="123.0" class="s" text-anchor="middle" dominant-baseline="middle">condition</text></g><line x1="542" y1="190" x2="640" y2="185" stroke="#354150" stroke-width="2" marker-end="url(#ah)" class="flow"/><g><rect x="642" y="159" width="220" height="54" rx="12" fill="#f5faff" stroke="#d9e7f7" stroke-width="1.5"/><text x="752.0" y="177.0" class="t" text-anchor="middle" dominant-baseline="middle">Action group</text><text x="752.0" y="198.0" class="s" text-anchor="middle" dominant-baseline="middle">email · SMS · webhook</text></g><line x1="542" y1="190" x2="640" y2="260" stroke="#354150" stroke-width="2" marker-end="url(#ah)" class="flow"/><g><rect x="642" y="234" width="220" height="54" rx="12" fill="#f5faff" stroke="#d9e7f7" stroke-width="1.5"/><text x="752.0" y="252.0" class="t" text-anchor="middle" dominant-baseline="middle">Workbook / dashboard</text><text x="752.0" y="273.0" class="s" text-anchor="middle" dominant-baseline="middle">see it</text></g></svg>