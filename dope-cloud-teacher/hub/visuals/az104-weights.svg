<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-labelledby="t_az104-weights"><title id="t_az104-weights">AZ-104 exam domain weights as ranges</title>
<style>
