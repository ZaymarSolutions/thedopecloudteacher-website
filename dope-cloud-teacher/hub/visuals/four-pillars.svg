<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-labelledby="t_four-pillars"><title id="t_four-pillars">Four pillars: governance, compliance, human oversight, morale and trust</title>
<style>
 text{font-family:'Source Sans 3', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;fill:#0B0B12}
 .t{font-size:15px;font-weight:600} .s{font-size:12px;fill:#354150} .h{font-size:20px;font-weight:800}
 .k{font-size:11px;letter-spacing:1.5px;font-weight:700;fill:#354150} .w{fill:#fff}
 .flow{stroke-dasharray:6 6;animation:dash 1.4s linear infinite}
 .pulse{animation:pulse 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
 @keyframes dash{to{stroke-dashoffset:-24}}
 @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.75;transform:scale(1.04)}}
 @keyframes rise{from{opacity:.15;transform:translateY(6px)}to{opacity:1;transform:none}}
 @media (prefers-reduced-motion: reduce){.flow,.pulse,.rise{animation:none}}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#354150"/></marker></defs><rect x="0" y="0" width="900" height="330" rx="18" fill="#ffffff"/><rect x="0.5" y="0.5" width="899" height="329" rx="18" fill="none" stroke="#d9e7f7"/><text x="28" y="34.0" class="k" text-anchor="start" dominant-baseline="middle">DCT GOVERNING PRINCIPLE</text><text x="28" y="60.0" class="h" text-anchor="start" dominant-baseline="middle">Four pillars in every program</text><rect x="60" y="88" width="780" height="26" rx="8" fill="#0B0B12"/><text x="450" y="101.0" class="k" text-anchor="middle" dominant-baseline="middle" style="fill:#fff">RESPONSIBLE USE OF CLOUD + AI</text><g style="animation-delay:0.0s"><rect x="80" y="124" width="164" height="150" rx="10" fill="#12487e"/><text x="162" y="180.0" class="t" text-anchor="middle" dominant-baseline="middle" style="fill:#fff">Governance</text><text x="162" y="210.0" class="s" text-anchor="middle" dominant-baseline="middle" style="fill:#fff">who owns &amp; approves</text></g><g style="animation-delay:0.15s"><rect x="272" y="124" width="164" height="150" rx="10" fill="#1267cf"/><text x="354" y="180.0" class="t" text-anchor="middle" dominant-baseline="middle" style="fill:#fff">Compliance</text><text x="354" y="210.0" class="s" text-anchor="middle" dominant-baseline="middle" style="fill:#fff">rules that already apply</text></g><g style="animation-delay:0.3s"><rect x="464" y="124" width="164" height="150" rx="10" fill="#1267cf"/><text x="546" y="180.0" class="t" text-anchor="middle" dominant-baseline="middle" style="fill:#fff">Human oversight</text><text x="546" y="210.0" class="s" text-anchor="middle" dominant-baseline="middle" style="fill:#fff">a person confirms</text></g><g style="animation-delay:0.44999999999999996s"><rect x="656" y="124" width="164" height="150" rx="10" fill="#3f94e9"/><text x="738" y="180.0" class="t" text-anchor="middle" dominant-baseline="middle" style="fill:#fff">Morale &amp; trust</text><text x="738" y="210.0" class="s" text-anchor="middle" dominant-baseline="middle" style="fill:#fff">people stay engaged</text></g><rect x="60" y="284" width="780" height="20" rx="6" fill="#d9e7f7"/><text x="450" y="294.0" class="s" text-anchor="middle" dominant-baseline="middle">foundation: technical skill</text></svg>