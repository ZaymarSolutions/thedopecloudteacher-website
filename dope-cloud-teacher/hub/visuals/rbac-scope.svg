<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-labelledby="t_rbac-scope"><title id="t_rbac-scope">RBAC scopes nested from management group to resource with inheritance</title>
<style>
 text{font-family:'Source Sans 3', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;fill:#0B0B12}
 .t{font-size:15px;font-weight:600} .s{font-size:12px;fill:#354150} .h{font-size:20px;font-weight:800}
 .k{font-size:11px;letter-spacing:1.5px;font-weight:700;fill:#354150} .w{fill:#fff}
 .flow{stroke-dasharray:6 6;animation:dash 1.4s linear infinite}
 .pulse{animation:pulse 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
 @keyframes dash{to{stroke-dashoffset:-24}}
 @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.75;transform:scale(1.04)}}
 @keyframes rise{from{opacity:.15;transform:translateY(6px)}to{opacity:1;transform:none}}
 @media (prefers-reduced-motion: reduce){.flow,.pulse,.rise{animation:none}}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#354150"/></marker></defs><rect x="0" y="0" width="900" height="340" rx="18" fill="#ffffff"/><rect x="0.5" y="0.5" width="899" height="339" rx="18" fill="none" stroke="#d9e7f7"/><text x="28" y="34.0" class="k" text-anchor="start" dominant-baseline="middle">AZURE RBAC</text><text x="28" y="60.0" class="h" text-anchor="start" dominant-baseline="middle">Who + what + where = access (and it flows down)</text><rect x="40" y="92" width="820" height="230" rx="14" fill="#12487e" opacity=".10" stroke="#12487e"/><text x="56" y="112.0" class="k" text-anchor="start" dominant-baseline="middle" style="fill:#12487e">Management group</text><rect x="90" y="144" width="720" height="178" rx="14" fill="#1267cf" opacity=".10" stroke="#1267cf"/><text x="106" y="164.0" class="k" text-anchor="start" dominant-baseline="middle" style="fill:#1267cf">Subscription</text><rect x="140" y="196" width="620" height="126" rx="14" fill="#102b48" opacity=".10" stroke="#102b48"/><text x="156" y="216.0" class="k" text-anchor="start" dominant-baseline="middle" style="fill:#102b48">Resource group</text><rect x="190" y="248" width="520" height="74" rx="14" fill="#3f94e9" opacity=".10" stroke="#3f94e9"/><text x="206" y="268.0" class="k" text-anchor="start" dominant-baseline="middle" style="fill:#3f94e9">Resource</text><g class="pulse"><rect x="560" y="250" width="260" height="56" rx="12" fill="#0B0B12" stroke="#0B0B12" stroke-width="1.5"/><text x="690.0" y="269.0" class="t" text-anchor="middle" dominant-baseline="middle" style="fill:#fff">Role assignment</text><text x="690.0" y="290.0" class="s" text-anchor="middle" dominant-baseline="middle" style="fill:#eaf0ff">principal · role · scope</text></g></svg>