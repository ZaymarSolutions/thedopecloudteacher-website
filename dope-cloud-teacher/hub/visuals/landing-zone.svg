<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-labelledby="t_landing-zone"><title id="t_landing-zone">CAF landing zone management group hierarchy</title>
<style>
 text{font-family:'Source Sans 3', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;fill:#0B0B12}
 .t{font-size:15px;font-weight:600} .s{font-size:12px;fill:#354150} .h{font-size:20px;font-weight:800}
 .k{font-size:11px;letter-spacing:1.5px;font-weight:700;fill:#354150} .w{fill:#fff}
 .flow{stroke-dasharray:6 6;animation:dash 1.4s linear infinite}
 .pulse{animation:pulse 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
 @keyframes dash{to{stroke-dashoffset:-24}}
 @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.75;transform:scale(1.04)}}
 @keyframes rise{from{opacity:.15;transform:translateY(6px)}to{opacity:1;transform:none}}
 @media (prefers-reduced-motion: reduce){.flow,.pulse,.rise{animation:none}}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#354150"/></marker></defs><rect x="0" y="0" width="900" height="400" rx="18" fill="#ffffff"/><rect x="0.5" y="0.5" width="899" height="399" rx="18" fill="none" stroke="#d9e7f7"/><text x="28" y="34.0" class="k" text-anchor="start" dominant-baseline="middle">CLOUD ADOPTION FRAMEWORK</text><text x="28" y="60.0" class="h" text-anchor="start" dominant-baseline="middle">Azure landing zone management groups</text><g><rect x="340" y="86" width="220" height="46" rx="12" fill="#0B0B12" stroke="#0B0B12" stroke-width="1.5"/><text x="450.0" y="109.0" class="t" text-anchor="middle" dominant-baseline="middle" style="fill:#fff">Tenant root group</text></g><line x1="450" y1="132" x2="450" y2="158" stroke="#354150" stroke-width="2" marker-end="url(#ah)" class="flow"/><g><rect x="340" y="160" width="220" height="46" rx="12" fill="#12487e" stroke="#12487e" stroke-width="1.5"/><text x="450.0" y="183.0" class="t" text-anchor="middle" dominant-baseline="middle" style="fill:#fff">Organization</text></g><line x1="450" y1="206" x2="135" y2="236" stroke="#354150" stroke-width="2" marker-end="url(#ah)" class="flow"/><g><rect x="40" y="238" width="190" height="44" rx="12" fill="#1267cf" stroke="#1267cf" stroke-width="1.5"/><text x="135.0" y="260.0" class="t" text-anchor="middle" dominant-baseline="middle" style="fill:#fff">Platform</text></g><g><rect x="50" y="296" width="170" height="26" rx="6" fill="#f5faff" stroke="#d9e7f7" stroke-width="1.5"/><text x="135.0" y="309.0" class="t" text-anchor="middle" dominant-baseline="middle">Identity</text></g><g><rect x="50" y="328" width="170" height="26" rx="6" fill="#f5faff" stroke="#d9e7f7" stroke-width="1.5"/><text x="135.0" y="341.0" class="t" text-anchor="middle" dominant-baseline="middle">Management</text></g><g><rect x="50" y="360" width="170" height="26" rx="6" fill="#f5faff" stroke="#d9e7f7" stroke-width="1.5"/><text x="135.0" y="373.0" class="t" text-anchor="middle" dominant-baseline="middle">Connectivity</text></g><line x1="450" y1="206" x2="345" y2="236" stroke="#354150" stroke-width="2" marker-end="url(#ah)" class="flow"/><g><rect x="250" y="238" width="190" height="44" rx="12" fill="#102b48" stroke="#102b48" stroke-width="1.5"/><text x="345.0" y="260.0" class="t" text-anchor="middle" dominant-baseline="middle" style="fill:#fff">Landing zones</text></g><g><rect x="260" y="296" width="170" height="26" rx="6" fill="#f5faff" stroke="#d9e7f7" stroke-width="1.5"/><text x="345.0" y="309.0" class="t" text-anchor="middle" dominant-baseline="middle">Corp</text></g><g><rect x="260" y="328" width="170" height="26" rx="6" fill="#f5faff" stroke="#d9e7f7" stroke-width="1.5"/><text x="345.0" y="341.0" class="t" text-anchor="middle" dominant-baseline="middle">Online</text></g><line x1="450" y1="206" x2="555" y2="236" stroke="#354150" stroke-width="2" marker-end="url(#ah)" class="flow"/><g><rect x="460" y="238" width="190" height="44" rx="12" fill="#3f94e9" stroke="#3f94e9" stroke-width="1.5"/><text x="555.0" y="260.0" class="t" text-anchor="middle" dominant-baseline="middle" style="fill:#fff">Sandbox</text></g><line x1="450" y1="206" x2="765" y2="236" stroke="#354150" stroke-width="2" marker-end="url(#ah)" class="flow"/><g><rect x="670" y="238" width="190" height="44" rx="12" fill="#354150" stroke="#354150" stroke-width="1.5"/><text x="765.0" y="260.0" class="t" text-anchor="middle" dominant-baseline="middle" style="fill:#fff">Decommissioned</text></g></svg>