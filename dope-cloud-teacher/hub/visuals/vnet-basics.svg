<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-labelledby="t_vnet-basics"><title id="t_vnet-basics">Virtual network with subnets, private endpoint, peering, VPN and ExpressRoute</title>
