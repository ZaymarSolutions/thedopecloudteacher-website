<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-labelledby="t_agent-loop"><title id="t_agent-loop">An AI agent loop calling tools with human approval for consequential actions</title>
<style>
 text{font-family:'Source Sans 3', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;fill:#0B0B12}
 .t{font-size:15px;font-weight:600} .s{font-size:12px;fill:#354150} .h{font-size:20px;font-weight:800}
 .k{font-size:11px;letter-spacing:1.5px;font-weight:700;fill:#354150} .w{fill:#fff}
 .flow{stroke-dasharray:6 6;animation:dash 1.4s linear infinite}
 .pulse{animation:pulse 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
 @keyframes dash{to{stroke-dashoffset:-24}}
 @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.75;transform:scale(1.04)}}
 @keyframes rise{from{opacity:.15;transform:translateY(6px)}to{opacity:1;transform:none}}
 @media (prefers-reduced-motion: reduce){.flow,.pulse,.rise{animation:none}}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#354150"/></marker></defs><rect x="0" y="0" width="900" height="360" rx="18" fill="#ffffff"/><rect x="0.5" y="0.5" width="899" height="359" rx="18" fill="none" stroke="#d9e7f7"/><text x="28" y="34.0" class="k" text-anchor="start" dominant-baseline="middle">AGENTS</text><text x="28" y="60.0" class="h" text-anchor="start" dominant-baseline="middle">Think, act, check — with only the keys you allow</text><g class="pulse"><rect x="370" y="140" width="160" height="80" rx="12" fill="#1267cf" stroke="#1267cf" stroke-width="1.5"/><text x="450.0" y="171.0" class="t" text-anchor="middle" dominant-baseline="middle" style="fill:#fff">Agent</text><text x="450.0" y="192.0" class="s" text-anchor="middle" dominant-baseline="middle" style="fill:#eaf0ff">model + instructions</text></g><g><rect x="40" y="86" width="160" height="48" rx="10" fill="#f5faff" stroke="#d9e7f7" stroke-width="1.5"/><text x="120.0" y="110.0" class="t" text-anchor="middle" dominant-baseline="middle">User goal</text></g><g><rect x="40" y="226" width="160" height="48" rx="10" fill="#f5faff" stroke="#d9e7f7" stroke-width="1.5"/><text x="120.0" y="250.0" class="t" text-anchor="middle" dominant-baseline="middle">Reply</text></g><g><rect x="620" y="66" width="160" height="48" rx="10" fill="#f5faff" stroke="#d9e7f7" stroke-width="1.5"/><text x="700.0" y="90.0" class="t" text-anchor="middle" dominant-baseline="middle">File search</text></g><g><rect x="620" y="146" width="160" height="48" rx="10" fill="#f5faff" stroke="#d9e7f7" stroke-width="1.5"/><text x="700.0" y="170.0" class="t" text-anchor="middle" dominant-baseline="middle">Function / API</text></g><g><rect x="620" y="226" width="160" height="48" rx="10" fill="#f5faff" stroke="#d9e7f7" stroke-width="1.5"/><text x="700.0" y="250.0" class="t" text-anchor="middle" dominant-baseline="middle">Code interpreter</text></g><line x1="200" y1="110" x2="368" y2="165" stroke="#354150" stroke-width="2" marker-end="url(#ah)" class="flow"/><line x1="368" y1="200" x2="200" y2="250" stroke="#354150" stroke-width="2" marker-end="url(#ah)" class="flow"/><line x1="530" y1="180" x2="618" y2="90" stroke="#354150" stroke-width="2" marker-end="url(#ah)" class="flow"/><line x1="530" y1="180" x2="618" y2="170" stroke="#354150" stroke-width="2" marker-end="url(#ah)" class="flow"/><line x1="530" y1="180" x2="618" y2="250" stroke="#354150" stroke-width="2" marker-end="url(#ah)" class="flow"/><g><rect x="440" y="302" width="420" height="40" rx="10" fill="#3f94e9" stroke="#3f94e9" stroke-width="1.5"/><text x="650.0" y="322.0" class="t" text-anchor="middle" dominant-baseline="middle">Human approval before actions that send, buy or delete</text></g></svg>