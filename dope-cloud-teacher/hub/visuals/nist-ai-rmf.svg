<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" width="900" height="410" role="img" aria-labelledby="t_nist-ai-rmf"><title id="t_nist-ai-rmf">NIST AI Risk Management Framework functions: govern, map, measure, manage</title>
<style>
 text{font-family:'Source Sans 3', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;fill:#0B0B12}
 .t{font-size:15px;font-weight:600} .s{font-size:12px;fill:#354150} .h{font-size:20px;font-weight:800}
 .k{font-size:11px;letter-spacing:1.5px;font-weight:700;fill:#354150} .w{fill:#fff}
 .flow{stroke-dasharray:6 6;animation:dash 1.4s linear infinite}
 .pulse{animation:pulse 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
 @keyframes dash{to{stroke-dashoffset:-24}}
 @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.75;transform:scale(1.04)}}
 @keyframes rise{from{opacity:.15;transform:translateY(6px)}to{opacity:1;transform:none}}
 @media (prefers-reduced-motion: reduce){.flow,.pulse,.rise{animation:none}}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#354150"/></marker></defs><rect x="0" y="0" width="900" height="410" rx="18" fill="#ffffff"/><rect x="0.5" y="0.5" width="899" height="409" rx="18" fill="none" stroke="#d9e7f7"/><text x="28" y="34.0" class="k" text-anchor="start" dominant-baseline="middle">NIST AI RMF 1.0</text><text x="28" y="60.0" class="h" text-anchor="start" dominant-baseline="middle">Govern at the center; Map, Measure, Manage around it</text><circle cx="450" cy="225" r="64" fill="#0B0B12" class="pulse"/><text x="450" y="215.0" class="t" text-anchor="middle" dominant-baseline="middle" style="fill:#fff">GOVERN</text><text x="450" y="238.0" class="s" text-anchor="middle" dominant-baseline="middle" style="fill:#cfd8f5">culture · roles</text><circle cx="200" cy="160" r="52" fill="#1267cf"/><text x="200" y="152.0" class="t" text-anchor="middle" dominant-baseline="middle" style="fill:#fff">MAP</text><text x="200" y="174.0" class="s" text-anchor="middle" dominant-baseline="middle" style="fill:#fff">context</text><circle cx="700" cy="160" r="52" fill="#102b48"/><text x="700" y="152.0" class="t" text-anchor="middle" dominant-baseline="middle" style="fill:#fff">MEASURE</text><text x="700" y="174.0" class="s" text-anchor="middle" dominant-baseline="middle" style="fill:#fff">test &amp; track</text><circle cx="450" cy="330" r="52" fill="#123e70"/><text x="450" y="322.0" class="t" text-anchor="middle" dominant-baseline="middle" style="fill:#fff">MANAGE</text><text x="450" y="344.0" class="s" text-anchor="middle" dominant-baseline="middle" style="fill:#fff">act &amp; monitor</text><path d="M 252 160 Q 450 90 648 160" fill="none" stroke="#354150" stroke-width="2" class="flow" marker-end="url(#ah)"/><path d="M 690 210 Q 640 320 502 330" fill="none" stroke="#354150" stroke-width="2" class="flow" marker-end="url(#ah)"/><path d="M 398 330 Q 240 320 205 212" fill="none" stroke="#354150" stroke-width="2" class="flow" marker-end="url(#ah)"/></svg>