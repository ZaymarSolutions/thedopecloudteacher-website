<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-labelledby="t_fact-check"><title id="t_fact-check">Four-step two-minute fact check for AI answers</title>
<style>
 text{font-family:'Source Sans 3', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;fill:#0B0B12}
 .t{font-size:15px;font-weight:600} .s{font-size:12px;fill:#354150} .h{font-size:20px;font-weight:800}
 .k{font-size:11px;letter-spacing:1.5px;font-weight:700;fill:#354150} .w{fill:#fff}
 .flow{stroke-dasharray:6 6;animation:dash 1.4s linear infinite}
 .pulse{animation:pulse 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
 @keyframes dash{to{stroke-dashoffset:-24}}
 @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.75;transform:scale(1.04)}}
 @keyframes rise{from{opacity:.15;transform:translateY(6px)}to{opacity:1;transform:none}}
 @media (prefers-reduced-motion: reduce){.flow,.pulse,.rise{animation:none}}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#354150"/></marker></defs><rect x="0" y="0" width="900" height="280" rx="18" fill="#ffffff"/><rect x="0.5" y="0.5" width="899" height="279" rx="18" fill="none" stroke="#d9e7f7"/><text x="28" y="34.0" class="k" text-anchor="start" dominant-baseline="middle">THE 2-MINUTE FACT CHECK</text><text x="28" y="60.0" class="h" text-anchor="start" dominant-baseline="middle">Before you trust it, check it</text><g><rect x="40" y="110" width="190" height="100" rx="12" fill="#c2352f" stroke="none" stroke-width="1.5"/><text x="135.0" y="151.0" class="t" text-anchor="middle" dominant-baseline="middle" style="fill:#fff">Stop</text><text x="135.0" y="172.0" class="s" text-anchor="middle" dominant-baseline="middle" style="fill:#eaf0ff">Does it matter?</text></g><line x1="230" y1="160" x2="250" y2="160" stroke="#354150" stroke-width="2" marker-end="url(#ah)" class="flow"/><g><rect x="252" y="110" width="190" height="100" rx="12" fill="#3f94e9" stroke="none" stroke-width="1.5"/><text x="347.0" y="151.0" class="t" text-anchor="middle" dominant-baseline="middle" style="fill:#fff">Source</text><text x="347.0" y="172.0" class="s" text-anchor="middle" dominant-baseline="middle" style="fill:#eaf0ff">Open the links yourself</text></g><line x1="442" y1="160" x2="462" y2="160" stroke="#354150" stroke-width="2" marker-end="url(#ah)" class="flow"/><g><rect x="464" y="110" width="190" height="100" rx="12" fill="#1267cf" stroke="none" stroke-width="1.5"/><text x="559.0" y="151.0" class="t" text-anchor="middle" dominant-baseline="middle" style="fill:#fff">Second opinion</text><text x="559.0" y="172.0" class="s" text-anchor="middle" dominant-baseline="middle" style="fill:#eaf0ff">.gov · bank · hospital</text></g><line x1="654" y1="160" x2="674" y2="160" stroke="#354150" stroke-width="2" marker-end="url(#ah)" class="flow"/><g><rect x="676" y="110" width="190" height="100" rx="12" fill="#0f8a5f" stroke="none" stroke-width="1.5"/><text x="771.0" y="151.0" class="t" text-anchor="middle" dominant-baseline="middle" style="fill:#fff">Ask a human</text><text x="771.0" y="172.0" class="s" text-anchor="middle" dominant-baseline="middle" style="fill:#eaf0ff">doctor · lawyer · banker</text></g></svg>