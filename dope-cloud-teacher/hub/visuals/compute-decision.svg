<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-labelledby="t_compute-decision"><title id="t_compute-decision">Decision tree for choosing Azure compute services</title>
<style>
 text{font-family:'Source Sans 3', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;fill:#0B0B12}
 .t{font-size:15px;font-weight:600} .s{font-size:12px;fill:#354150} .h{font-size:20px;font-weight:800}
 .k{font-size:11px;letter-spacing:1.5px;font-weight:700;fill:#354150} .w{fill:#fff}
 .flow{stroke-dasharray:6 6;animation:dash 1.4s linear infinite}
 .pulse{animation:pulse 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
 @keyframes dash{to{stroke-dashoffset:-24}}
 @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.75;transform:scale(1.04)}}
 @keyframes rise{from{opacity:.15;transform:translateY(6px)}to{opacity:1;transform:none}}
 @media (prefers-reduced-motion: reduce){.flow,.pulse,.rise{animation:none}}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#354150"/></marker></defs><rect x="0" y="0" width="900" height="400" rx="18" fill="#ffffff"/><rect x="0.5" y="0.5" width="899" height="399" rx="18" fill="none" stroke="#d9e7f7"/><text x="28" y="34.0" class="k" text-anchor="start" dominant-baseline="middle">ARCHITECT&#x27;S SHORTCUT</text><text x="28" y="60.0" class="h" text-anchor="start" dominant-baseline="middle">Choosing Azure compute</text><g><rect x="60" y="92" width="320" height="44" rx="22" fill="#f5faff" stroke="#d9e7f7" stroke-width="1.5"/><text x="220.0" y="114.0" class="t" text-anchor="middle" dominant-baseline="middle">Need full OS control?</text></g><line x1="380" y1="114" x2="498" y2="114" stroke="#354150" stroke-width="2" marker-end="url(#ah)" class="flow"/><text x="439.0" y="104.0" class="s" text-anchor="middle" dominant-baseline="middle">yes</text><g><rect x="500" y="92" width="340" height="44" rx="12" fill="#1267cf" stroke="none" stroke-width="1.5"/><text x="670.0" y="114.0" class="t" text-anchor="middle" dominant-baseline="middle" style="fill:#fff">VMs / VM Scale Sets</text></g><line x1="220" y1="136" x2="220" y2="148" stroke="#354150" stroke-width="2" marker-end="url(#ah)"/><g><rect x="60" y="150" width="320" height="44" rx="22" fill="#f5faff" stroke="#d9e7f7" stroke-width="1.5"/><text x="220.0" y="172.0" class="t" text-anchor="middle" dominant-baseline="middle">Containers?</text></g><line x1="380" y1="172" x2="498" y2="172" stroke="#354150" stroke-width="2" marker-end="url(#ah)" class="flow"/><text x="439.0" y="162.0" class="s" text-anchor="middle" dominant-baseline="middle">yes</text><g><rect x="500" y="150" width="340" height="44" rx="12" fill="#102b48" stroke="none" stroke-width="1.5"/><text x="670.0" y="172.0" class="t" text-anchor="middle" dominant-baseline="middle" style="fill:#fff">Container Apps (or AKS for full K8s)</text></g><line x1="220" y1="194" x2="220" y2="206" stroke="#354150" stroke-width="2" marker-end="url(#ah)"/><g><rect x="60" y="208" width="320" height="44" rx="22" fill="#f5faff" stroke="#d9e7f7" stroke-width="1.5"/><text x="220.0" y="230.0" class="t" text-anchor="middle" dominant-baseline="middle">Web app or API?</text></g><line x1="380" y1="230" x2="498" y2="230" stroke="#354150" stroke-width="2" marker-end="url(#ah)" class="flow"/><text x="439.0" y="220.0" class="s" text-anchor="middle" dominant-baseline="middle">yes</text><g><rect x="500" y="208" width="340" height="44" rx="12" fill="#1267cf" stroke="none" stroke-width="1.5"/><text x="670.0" y="230.0" class="t" text-anchor="middle" dominant-baseline="middle" style="fill:#fff">App Service</text></g><line x1="220" y1="252" x2="220" y2="264" stroke="#354150" stroke-width="2" marker-end="url(#ah)"/><g><rect x="60" y="266" width="320" height="44" rx="22" fill="#f5faff" stroke="#d9e7f7" stroke-width="1.5"/><text x="220.0" y="288.0" class="t" text-anchor="middle" dominant-baseline="middle">Event-driven, short code?</text></g><line x1="380" y1="288" x2="498" y2="288" stroke="#354150" stroke-width="2" marker-end="url(#ah)" class="flow"/><text x="439.0" y="278.0" class="s" text-anchor="middle" dominant-baseline="middle">yes</text><g><rect x="500" y="266" width="340" height="44" rx="12" fill="#102b48" stroke="none" stroke-width="1.5"/><text x="670.0" y="288.0" class="t" text-anchor="middle" dominant-baseline="middle" style="fill:#fff">Azure Functions</text></g><line x1="220" y1="310" x2="220" y2="322" stroke="#354150" stroke-width="2" marker-end="url(#ah)"/><g><rect x="60" y="324" width="320" height="44" rx="22" fill="#f5faff" stroke="#d9e7f7" stroke-width="1.5"/><text x="220.0" y="346.0" class="t" text-anchor="middle" dominant-baseline="middle">Huge parallel batch?</text></g><line x1="380" y1="346" x2="498" y2="346" stroke="#354150" stroke-width="2" marker-end="url(#ah)" class="flow"/><text x="439.0" y="336.0" class="s" text-anchor="middle" dominant-baseline="middle">yes</text><g><rect x="500" y="324" width="340" height="44" rx="12" fill="#1267cf" stroke="none" stroke-width="1.5"/><text x="670.0" y="346.0" class="t" text-anchor="middle" dominant-baseline="middle" style="fill:#fff">Azure Batch</text></g></svg>