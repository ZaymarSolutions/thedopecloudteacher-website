<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="t_recovery-plan"><title id="t_recovery-plan">Six recovery steps after a scam or hack</title>
<style>
 text{font-family:'Source Sans 3', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;fill:#0B0B12}
 .t{font-size:15px;font-weight:600} .s{font-size:12px;fill:#354150} .h{font-size:20px;font-weight:800}
 .k{font-size:11px;letter-spacing:1.5px;font-weight:700;fill:#354150} .w{fill:#fff}
 .flow{stroke-dasharray:6 6;animation:dash 1.4s linear infinite}
 .pulse{animation:pulse 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
 @keyframes dash{to{stroke-dashoffset:-24}}
 @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.75;transform:scale(1.04)}}
 @keyframes rise{from{opacity:.15;transform:translateY(6px)}to{opacity:1;transform:none}}
 @media (prefers-reduced-motion: reduce){.flow,.pulse,.rise{animation:none}}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#354150"/></marker></defs><rect x="0" y="0" width="900" height="300" rx="18" fill="#ffffff"/><rect x="0.5" y="0.5" width="899" height="299" rx="18" fill="none" stroke="#d9e7f7"/><text x="28" y="34.0" class="k" text-anchor="start" dominant-baseline="middle">BOUNCE BACK</text><text x="28" y="60.0" class="h" text-anchor="start" dominant-baseline="middle">If something already happened</text><circle cx="100" cy="140" r="26" fill="#0B0B12"/><text x="100" y="140.0" class="t" text-anchor="middle" dominant-baseline="middle" style="fill:#fff">1</text><text x="100" y="201.0" class="t" text-anchor="middle" dominant-baseline="middle">Stop &amp;</text><text x="100" y="219.0" class="t" text-anchor="middle" dominant-baseline="middle">breathe</text><line x1="128" y1="140" x2="212" y2="140" stroke="#354150" stroke-width="2" marker-end="url(#ah)" class="flow"/><circle cx="240" cy="140" r="26" fill="#1267cf"/><text x="240" y="140.0" class="t" text-anchor="middle" dominant-baseline="middle" style="fill:#fff">2</text><text x="240" y="201.0" class="t" text-anchor="middle" dominant-baseline="middle">Call your</text><text x="240" y="219.0" class="t" text-anchor="middle" dominant-baseline="middle">bank</text><line x1="268" y1="140" x2="352" y2="140" stroke="#354150" stroke-width="2" marker-end="url(#ah)" class="flow"/><circle cx="380" cy="140" r="26" fill="#102b48"/><text x="380" y="140.0" class="t" text-anchor="middle" dominant-baseline="middle" style="fill:#fff">3</text><text x="380" y="201.0" class="t" text-anchor="middle" dominant-baseline="middle">Change</text><text x="380" y="219.0" class="t" text-anchor="middle" dominant-baseline="middle">passwords</text><line x1="408" y1="140" x2="492" y2="140" stroke="#354150" stroke-width="2" marker-end="url(#ah)" class="flow"/><circle cx="520" cy="140" r="26" fill="#12487e"/><text x="520" y="140.0" class="t" text-anchor="middle" dominant-baseline="middle" style="fill:#fff">4</text><text x="520" y="201.0" class="t" text-anchor="middle" dominant-baseline="middle">Freeze</text><text x="520" y="219.0" class="t" text-anchor="middle" dominant-baseline="middle">credit</text><line x1="548" y1="140" x2="632" y2="140" stroke="#354150" stroke-width="2" marker-end="url(#ah)" class="flow"/><circle cx="660" cy="140" r="26" fill="#123e70"/><text x="660" y="140.0" class="t" text-anchor="middle" dominant-baseline="middle" style="fill:#fff">5</text><text x="660" y="210.0" class="t" text-anchor="middle" dominant-baseline="middle">Report</text><line x1="688" y1="140" x2="772" y2="140" stroke="#354150" stroke-width="2" marker-end="url(#ah)" class="flow"/><circle cx="800" cy="140" r="26" fill="#0f8a5f"/><text x="800" y="140.0" class="t" text-anchor="middle" dominant-baseline="middle" style="fill:#fff">6</text><text x="800" y="201.0" class="t" text-anchor="middle" dominant-baseline="middle">Tell someone</text><text x="800" y="219.0" class="t" text-anchor="middle" dominant-baseline="middle">you trust</text><text x="450" y="268.0" class="s" text-anchor="middle" dominant-baseline="middle">ReportFraud.ftc.gov · IdentityTheft.gov · ic3.gov</text></svg>