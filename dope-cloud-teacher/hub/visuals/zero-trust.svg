<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-labelledby="t_zero-trust"><title id="t_zero-trust">Zero Trust principles: verify explicitly, least privilege, assume breach</title>
<style>
 text{font-family:'Source Sans 3', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;fill:#0B0B12}
 .t{font-size:15px;font-weight:600} .s{font-size:12px;fill:#354150} .h{font-size:20px;font-weight:800}
 .k{font-size:11px;letter-spacing:1.5px;font-weight:700;fill:#354150} .w{fill:#fff}
 .flow{stroke-dasharray:6 6;animation:dash 1.4s linear infinite}
 .pulse{animation:pulse 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
 @keyframes dash{to{stroke-dashoffset:-24}}
 @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.75;transform:scale(1.04)}}
 @keyframes rise{from{opacity:.15;transform:translateY(6px)}to{opacity:1;transform:none}}
 @media (prefers-reduced-motion: reduce){.flow,.pulse,.rise{animation:none}}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#354150"/></marker></defs><rect x="0" y="0" width="900" height="330" rx="18" fill="#ffffff"/><rect x="0.5" y="0.5" width="899" height="329" rx="18" fill="none" stroke="#d9e7f7"/><text x="28" y="34.0" class="k" text-anchor="start" dominant-baseline="middle">ZERO TRUST</text><text x="28" y="60.0" class="h" text-anchor="start" dominant-baseline="middle">Never trust, always verify</text><g style="animation-delay:0.0s"><circle cx="170" cy="150" r="44" fill="#1267cf" class="pulse"/><text x="170" y="150.0" class="h" text-anchor="middle" dominant-baseline="middle" style="fill:#fff">1</text><text x="170" y="230.0" class="t" text-anchor="middle" dominant-baseline="middle">Verify explicitly</text><text x="170" y="256.0" class="s" text-anchor="middle" dominant-baseline="middle">identity · device · location · risk</text></g><g style="animation-delay:0.2s"><circle cx="450" cy="150" r="44" fill="#102b48" class="pulse"/><text x="450" y="150.0" class="h" text-anchor="middle" dominant-baseline="middle" style="fill:#fff">2</text><text x="450" y="230.0" class="t" text-anchor="middle" dominant-baseline="middle">Least privilege</text><text x="450" y="256.0" class="s" text-anchor="middle" dominant-baseline="middle">just-in-time · just-enough</text></g><g style="animation-delay:0.4s"><circle cx="730" cy="150" r="44" fill="#123e70" class="pulse"/><text x="730" y="150.0" class="h" text-anchor="middle" dominant-baseline="middle" style="fill:#fff">3</text><text x="730" y="230.0" class="t" text-anchor="middle" dominant-baseline="middle">Assume breach</text><text x="730" y="256.0" class="s" text-anchor="middle" dominant-baseline="middle">segment · encrypt · monitor</text></g><text x="450" y="300.0" class="s" text-anchor="middle" dominant-baseline="middle">Every door checks the wristband — not just the front door.</text></svg>