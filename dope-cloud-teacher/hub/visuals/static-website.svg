<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="t_static-website"><title id="t_static-website">Static website flow from laptop to storage to browser</title>
<style>
 text{font-family:'Source Sans 3', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;fill:#0B0B12}
 .t{font-size:15px;font-weight:600} .s{font-size:12px;fill:#354150} .h{font-size:20px;font-weight:800}
 .k{font-size:11px;letter-spacing:1.5px;font-weight:700;fill:#354150} .w{fill:#fff}
 .flow{stroke-dasharray:6 6;animation:dash 1.4s linear infinite}
 .pulse{animation:pulse 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
 @keyframes dash{to{stroke-dashoffset:-24}}
 @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.75;transform:scale(1.04)}}
 @keyframes rise{from{opacity:.15;transform:translateY(6px)}to{opacity:1;transform:none}}
 @media (prefers-reduced-motion: reduce){.flow,.pulse,.rise{animation:none}}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#354150"/></marker></defs><rect x="0" y="0" width="900" height="300" rx="18" fill="#ffffff"/><rect x="0.5" y="0.5" width="899" height="299" rx="18" fill="none" stroke="#d9e7f7"/><text x="28" y="34.0" class="k" text-anchor="start" dominant-baseline="middle">BUILD 1</text><text x="28" y="60.0" class="h" text-anchor="start" dominant-baseline="middle">How a static website is served from cloud storage</text><g><rect x="40" y="120" width="180" height="90" rx="12" fill="#f5faff" stroke="#d9e7f7" stroke-width="1.5"/><text x="130.0" y="156.0" class="t" text-anchor="middle" dominant-baseline="middle">Your laptop</text><text x="130.0" y="177.0" class="s" text-anchor="middle" dominant-baseline="middle">index.html · 404.html</text></g><g class="pulse"><rect x="330" y="110" width="240" height="110" rx="12" fill="#1267cf" stroke="#1267cf" stroke-width="1.5"/><text x="450.0" y="156.0" class="t" text-anchor="middle" dominant-baseline="middle" style="fill:#fff">Storage account</text><text x="450.0" y="177.0" class="s" text-anchor="middle" dominant-baseline="middle" style="fill:#eaf0ff">$web container · object storage</text></g><g><rect x="680" y="120" width="180" height="90" rx="12" fill="#f5faff" stroke="#d9e7f7" stroke-width="1.5"/><text x="770.0" y="156.0" class="t" text-anchor="middle" dominant-baseline="middle">Visitor&#x27;s browser</text><text x="770.0" y="177.0" class="s" text-anchor="middle" dominant-baseline="middle">https://….web.core…</text></g><line x1="220" y1="165" x2="328" y2="165" stroke="#354150" stroke-width="2" marker-end="url(#ah)" class="flow"/><text x="274.0" y="155.0" class="s" text-anchor="middle" dominant-baseline="middle">upload</text><line x1="570" y1="165" x2="678" y2="165" stroke="#354150" stroke-width="2" marker-end="url(#ah)" class="flow"/><text x="624.0" y="155.0" class="s" text-anchor="middle" dominant-baseline="middle">public read (GET)</text><text x="450" y="262.0" class="s" text-anchor="middle" dominant-baseline="middle">Public read only. Nobody can change your files without your access.</text></svg>