<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="t_three-controls"><title id="t_three-controls">Three cloud security controls: verify sign-in, limit access, watch activity</title>
<style>
 text{font-family:'Source Sans 3', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;fill:#0B0B12}
 .t{font-size:15px;font-weight:600} .s{font-size:12px;fill:#354150} .h{font-size:20px;font-weight:800}
 .k{font-size:11px;letter-spacing:1.5px;font-weight:700;fill:#354150} .w{fill:#fff}
 .flow{stroke-dasharray:6 6;animation:dash 1.4s linear infinite}
 .pulse{animation:pulse 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
 @keyframes dash{to{stroke-dashoffset:-24}}
 @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.75;transform:scale(1.04)}}
 @keyframes rise{from{opacity:.15;transform:translateY(6px)}to{opacity:1;transform:none}}
 @media (prefers-reduced-motion: reduce){.flow,.pulse,.rise{animation:none}}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#354150"/></marker></defs><rect x="0" y="0" width="900" height="300" rx="18" fill="#ffffff"/><rect x="0.5" y="0.5" width="899" height="299" rx="18" fill="none" stroke="#d9e7f7"/><text x="28" y="34.0" class="k" text-anchor="start" dominant-baseline="middle">CLOUD SECURITY</text><text x="28" y="60.0" class="h" text-anchor="start" dominant-baseline="middle">Three practical controls</text><rect x="40" y="96" width="260" height="170" rx="18" fill="#1267cf" opacity=".1" stroke="#1267cf"/><text x="64" y="130.0" class="h" text-anchor="start" dominant-baseline="middle" style="fill:#1267cf">01</text><text x="64" y="175.0" class="t" text-anchor="start" dominant-baseline="middle">Verify sign-in</text><text x="64" y="200.0" class="s" text-anchor="start" dominant-baseline="middle">MFA · passkeys · Conditional Access</text><circle cx="262" cy="130" r="12" fill="#1267cf" class="pulse"/><rect x="320" y="96" width="260" height="170" rx="18" fill="#102b48" opacity=".1" stroke="#102b48"/><text x="344" y="130.0" class="h" text-anchor="start" dominant-baseline="middle" style="fill:#102b48">02</text><text x="344" y="175.0" class="t" text-anchor="start" dominant-baseline="middle">Limit access</text><text x="344" y="200.0" class="s" text-anchor="start" dominant-baseline="middle">least privilege · PIM · segmentation</text><circle cx="542" cy="130" r="12" fill="#102b48" class="pulse"/><rect x="600" y="96" width="260" height="170" rx="18" fill="#123e70" opacity=".1" stroke="#123e70"/><text x="624" y="130.0" class="h" text-anchor="start" dominant-baseline="middle" style="fill:#123e70">03</text><text x="624" y="175.0" class="t" text-anchor="start" dominant-baseline="middle">Watch activity</text><text x="624" y="200.0" class="s" text-anchor="start" dominant-baseline="middle">logs · alerts · secure score</text><circle cx="822" cy="130" r="12" fill="#123e70" class="pulse"/></svg>