<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-labelledby="t_conditional-access"><title id="t_conditional-access">Conditional Access signals feeding a decision to allow, require MFA, require a compliant device or block</title>
<style>
 text{font-family:'Source Sans 3', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;fill:#0B0B12}
 .t{font-size:15px;font-weight:600} .s{font-size:12px;fill:#354150} .h{font-size:20px;font-weight:800}
 .k{font-size:11px;letter-spacing:1.5px;font-weight:700;fill:#354150} .w{fill:#fff}
 .flow{stroke-dasharray:6 6;animation:dash 1.4s linear infinite}
 .pulse{animation:pulse 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
 @keyframes dash{to{stroke-dashoffset:-24}}
 @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.75;transform:scale(1.04)}}
 @keyframes rise{from{opacity:.15;transform:translateY(6px)}to{opacity:1;transform:none}}
 @media (prefers-reduced-motion: reduce){.flow,.pulse,.rise{animation:none}}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#354150"/></marker></defs><rect x="0" y="0" width="900" height="320" rx="18" fill="#ffffff"/><rect x="0.5" y="0.5" width="899" height="319" rx="18" fill="none" stroke="#d9e7f7"/><text x="28" y="34.0" class="k" text-anchor="start" dominant-baseline="middle">CONDITIONAL ACCESS</text><text x="28" y="60.0" class="h" text-anchor="start" dominant-baseline="middle">IF these signals… THEN this decision</text><g><rect x="40" y="88" width="170" height="34" rx="8" fill="#f5faff" stroke="#d9e7f7" stroke-width="1.5"/><text x="125.0" y="105.0" class="t" text-anchor="middle" dominant-baseline="middle">User / group</text></g><line x1="210" y1="105" x2="360" y2="190" stroke="#354150" stroke-width="2" marker-end="url(#ah)" class="flow"/><g><rect x="40" y="130" width="170" height="34" rx="8" fill="#f5faff" stroke="#d9e7f7" stroke-width="1.5"/><text x="125.0" y="147.0" class="t" text-anchor="middle" dominant-baseline="middle">App</text></g><line x1="210" y1="147" x2="360" y2="190" stroke="#354150" stroke-width="2" marker-end="url(#ah)" class="flow"/><g><rect x="40" y="172" width="170" height="34" rx="8" fill="#f5faff" stroke="#d9e7f7" stroke-width="1.5"/><text x="125.0" y="189.0" class="t" text-anchor="middle" dominant-baseline="middle">Location</text></g><line x1="210" y1="189" x2="360" y2="190" stroke="#354150" stroke-width="2" marker-end="url(#ah)" class="flow"/><g><rect x="40" y="214" width="170" height="34" rx="8" fill="#f5faff" stroke="#d9e7f7" stroke-width="1.5"/><text x="125.0" y="231.0" class="t" text-anchor="middle" dominant-baseline="middle">Device state</text></g><line x1="210" y1="231" x2="360" y2="190" stroke="#354150" stroke-width="2" marker-end="url(#ah)" class="flow"/><g><rect x="40" y="256" width="170" height="34" rx="8" fill="#f5faff" stroke="#d9e7f7" stroke-width="1.5"/><text x="125.0" y="273.0" class="t" text-anchor="middle" dominant-baseline="middle">Risk</text></g><line x1="210" y1="273" x2="360" y2="190" stroke="#354150" stroke-width="2" marker-end="url(#ah)" class="flow"/><g class="pulse"><rect x="362" y="145" width="180" height="90" rx="12" fill="#1267cf" stroke="#1267cf" stroke-width="1.5"/><text x="452.0" y="181.0" class="t" text-anchor="middle" dominant-baseline="middle" style="fill:#fff">Policy engine</text><text x="452.0" y="202.0" class="s" text-anchor="middle" dominant-baseline="middle" style="fill:#eaf0ff">evaluated at sign-in</text></g><line x1="542" y1="190" x2="640" y2="100" stroke="#354150" stroke-width="2" marker-end="url(#ah)" class="flow"/><g><rect x="642" y="78" width="220" height="44" rx="12" fill="#0f8a5f" stroke="#0f8a5f" stroke-width="1.5"/><text x="752.0" y="100.0" class="t" text-anchor="middle" dominant-baseline="middle" style="fill:#fff">Allow</text></g><line x1="542" y1="190" x2="640" y2="158" stroke="#354150" stroke-width="2" marker-end="url(#ah)" class="flow"/><g><rect x="642" y="136" width="220" height="44" rx="12" fill="#3f94e9" stroke="#3f94e9" stroke-width="1.5"/><text x="752.0" y="158.0" class="t" text-anchor="middle" dominant-baseline="middle" style="fill:#fff">Require MFA / passkey</text></g><line x1="542" y1="190" x2="640" y2="216" stroke="#354150" stroke-width="2" marker-end="url(#ah)" class="flow"/><g><rect x="642" y="194" width="220" height="44" rx="12" fill="#12487e" stroke="#12487e" stroke-width="1.5"/><text x="752.0" y="216.0" class="t" text-anchor="middle" dominant-baseline="middle" style="fill:#fff">Require compliant device</text></g><line x1="542" y1="190" x2="640" y2="274" stroke="#354150" stroke-width="2" marker-end="url(#ah)" class="flow"/><g><rect x="642" y="252" width="220" height="44" rx="12" fill="#c2352f" stroke="#c2352f" stroke-width="1.5"/><text x="752.0" y="274.0" class="t" text-anchor="middle" dominant-baseline="middle" style="fill:#fff">Block</text></g></svg>