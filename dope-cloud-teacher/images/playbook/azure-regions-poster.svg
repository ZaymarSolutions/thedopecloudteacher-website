<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">Azure Regions and Availability Zones</title>
  <desc id="desc">Professional visual explainer for Azure regions and availability zones.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1026"/>
      <stop offset="100%" stop-color="#143870"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1600" fill="url(#bg)"/>
  <image href="/logo.svg?v=20260622c" x="78" y="64" width="138" height="138"/>
  <text x="240" y="132" font-family="Segoe UI, Arial" font-size="42" fill="#ffffff" font-weight="700">The Dope Cloud Teacher</text>
  <text x="78" y="250" font-family="Segoe UI, Arial" font-size="78" fill="#ffffff" font-weight="900">AZURE REGIONS</text>
  <text x="78" y="326" font-family="Segoe UI, Arial" font-size="68" fill="#5eead4" font-weight="900">AND AVAILABILITY ZONES</text>
  <text x="78" y="382" font-family="Segoe UI, Arial" font-size="34" fill="#dbeafe">Understand global design choices for performance, resilience, and compliance.</text>

  <rect x="78" y="430" width="1044" height="190" rx="16" fill="#0b1f4f" stroke="#60a5fa"/>
  <text x="112" y="500" font-family="Segoe UI, Arial" font-size="40" fill="#93c5fd" font-weight="800">Region</text>
  <text x="112" y="552" font-family="Segoe UI, Arial" font-size="30" fill="#e2e8f0">A geographic area containing one or more datacenters.</text>
  <text x="112" y="598" font-family="Segoe UI, Arial" font-size="30" fill="#e2e8f0">Choose regions based on latency, data residency, and service availability.</text>

  <rect x="78" y="650" width="1044" height="190" rx="16" fill="#112a63" stroke="#67e8f9"/>
  <text x="112" y="720" font-family="Segoe UI, Arial" font-size="40" fill="#67e8f9" font-weight="800">Availability Zone</text>
  <text x="112" y="772" font-family="Segoe UI, Arial" font-size="30" fill="#e2e8f0">Physically separate datacenter locations inside a region.</text>
  <text x="112" y="818" font-family="Segoe UI, Arial" font-size="30" fill="#e2e8f0">Use zones for high availability and fault isolation.</text>

  <rect x="78" y="870" width="1044" height="420" rx="16" fill="#0f172a" stroke="#38bdf8"/>
  <text x="112" y="936" font-family="Segoe UI, Arial" font-size="40" fill="#38bdf8" font-weight="800">Decision Checklist</text>
  <text x="112" y="994" font-family="Segoe UI, Arial" font-size="30" fill="#e2e8f0">1. Validate compliance and data residency requirements.</text>
  <text x="112" y="1044" font-family="Segoe UI, Arial" font-size="30" fill="#e2e8f0">2. Measure latency to user populations.</text>
  <text x="112" y="1094" font-family="Segoe UI, Arial" font-size="30" fill="#e2e8f0">3. Design for zone redundancy where supported.</text>
  <text x="112" y="1144" font-family="Segoe UI, Arial" font-size="30" fill="#e2e8f0">4. Document DR strategy across paired regions.</text>
  <text x="112" y="1194" font-family="Segoe UI, Arial" font-size="30" fill="#e2e8f0">5. Align architecture with AZ-900 objective mapping.</text>

  <rect x="78" y="1330" width="1044" height="190" rx="16" fill="#1d4ed8"/>
  <text x="112" y="1402" font-family="Segoe UI, Arial" font-size="40" fill="#ffffff" font-weight="800">Pro Tip</text>
  <text x="112" y="1460" font-family="Segoe UI, Arial" font-size="30" fill="#eaf2ff">Start with one primary region and one DR region, then add zones as workload criticality increases.</text>
</svg>
