<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">Enable Microsoft Entra PIM</title>
  <desc id="desc">Poster visual for enabling privileged identity management with six steps.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060913"/>
      <stop offset="60%" stop-color="#10194a"/>
      <stop offset="100%" stop-color="#2b1067"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#241048"/>
      <stop offset="100%" stop-color="#0e1f5d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#58e1ff"/>
      <stop offset="100%" stop-color="#b147ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1600" fill="url(#bg)"/>
  <rect x="40" y="40" width="1120" height="1520" rx="26" fill="none" stroke="#62d6ff" stroke-opacity="0.35"/>
  <image href="/logo.svg?v=20260704a" x="78" y="66" width="128" height="128"/>

  <g fill="#ffffff" font-family="Segoe UI, Arial, sans-serif">
    <text x="228" y="132" font-size="42" font-weight="700">TheDopeCloudTeacher.org</text>
    <text x="90" y="210" font-size="74" font-weight="800">HOW TO ENABLE</text>
    <text x="90" y="292" font-size="98" font-weight="900" fill="#b147ff">PIM IN AZURE AD</text>
    <text x="90" y="344" font-size="42" fill="#8fd9ff">Just-in-time access. Zero standing privilege.</text>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" fill="#e7ebff">
    <rect x="80" y="400" width="1040" height="150" rx="18" fill="url(#panel)" stroke="#7c4dff"/>
    <circle cx="130" cy="475" r="32" fill="#7c4dff"/><text x="120" y="487" font-size="34" font-weight="800">1</text>
    <text x="190" y="455" font-size="44" font-weight="700">Open PIM</text>
    <text x="190" y="500" font-size="30">Microsoft Entra ID -&gt; Privileged Identity Management</text>

    <rect x="80" y="580" width="1040" height="150" rx="18" fill="url(#panel)" stroke="#7c4dff"/>
    <circle cx="130" cy="655" r="32" fill="#7c4dff"/><text x="120" y="667" font-size="34" font-weight="800">2</text>
    <text x="190" y="635" font-size="44" font-weight="700">Select Role</text>
    <text x="190" y="680" font-size="30">Choose Global Admin, User Admin, or scoped resource role</text>

    <rect x="80" y="760" width="1040" height="150" rx="18" fill="url(#panel)" stroke="#7c4dff"/>
    <circle cx="130" cy="835" r="32" fill="#7c4dff"/><text x="120" y="847" font-size="34" font-weight="800">3</text>
    <text x="190" y="815" font-size="44" font-weight="700">Add Eligible Users</text>
    <text x="190" y="860" font-size="30">Assign eligible access, never always-on standing admin</text>

    <rect x="80" y="940" width="1040" height="150" rx="18" fill="url(#panel)" stroke="#7c4dff"/>
    <circle cx="130" cy="1015" r="32" fill="#7c4dff"/><text x="120" y="1027" font-size="34" font-weight="800">4</text>
    <text x="190" y="995" font-size="44" font-weight="700">Configure Settings</text>
    <text x="190" y="1040" font-size="30">Require MFA, approval, reason, and max activation duration</text>

    <rect x="80" y="1120" width="1040" height="150" rx="18" fill="url(#panel)" stroke="#7c4dff"/>
    <circle cx="130" cy="1195" r="32" fill="#7c4dff"/><text x="120" y="1207" font-size="34" font-weight="800">5</text>
    <text x="190" y="1175" font-size="44" font-weight="700">Activate Only When Needed</text>
    <text x="190" y="1220" font-size="30">Use just-in-time elevation with explicit approval flow</text>

    <rect x="80" y="1300" width="1040" height="150" rx="18" fill="url(#panel)" stroke="#7c4dff"/>
    <circle cx="130" cy="1375" r="32" fill="#7c4dff"/><text x="120" y="1387" font-size="34" font-weight="800">6</text>
    <text x="190" y="1355" font-size="44" font-weight="700">Review and Audit</text>
    <text x="190" y="1400" font-size="30">Audit activation logs and remove stale assignments</text>
  </g>

  <rect x="80" y="1488" width="1040" height="56" rx="12" fill="url(#accent)"/>
  <text x="106" y="1526" font-size="30" font-family="Segoe UI, Arial, sans-serif" fill="#0d1230" font-weight="800">Pro Tip: Pilot with a small admin group and enforce least privilege from day one.</text>
</svg>
