<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">Cloud Control with Azure Policy</title>
  <desc id="desc">Professional explainer on Azure Policy governance controls.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0c122c"/><stop offset="100%" stop-color="#1b3d80"/></linearGradient></defs>
  <rect width="1200" height="1600" fill="url(#bg)"/>
  <image href="/logo.svg?v=20260704a" x="78" y="64" width="138" height="138"/>
  <text x="240" y="132" font-family="Segoe UI, Arial" font-size="42" fill="#ffffff" font-weight="700">The Dope Cloud Teacher</text>
  <text x="78" y="250" font-family="Segoe UI, Arial" font-size="86" fill="#ffffff" font-weight="900">CLOUD CONTROL</text>
  <text x="78" y="332" font-family="Segoe UI, Arial" font-size="76" fill="#a78bfa" font-weight="900">WITH AZURE POLICY</text>
  <text x="78" y="388" font-family="Segoe UI, Arial" font-size="34" fill="#dbeafe">Enforce governance guardrails without slowing down delivery.</text>

  <rect x="78" y="430" width="1044" height="250" rx="16" fill="#0f172a" stroke="#818cf8"/>
  <text x="112" y="496" font-family="Segoe UI, Arial" font-size="40" fill="#c4b5fd" font-weight="800">What Azure Policy Does</text>
  <text x="112" y="552" font-family="Segoe UI, Arial" font-size="30" fill="#e2e8f0">- Audit and enforce standards at scale</text>
  <text x="112" y="602" font-family="Segoe UI, Arial" font-size="30" fill="#e2e8f0">- Block non-compliant resource deployments</text>
  <text x="112" y="652" font-family="Segoe UI, Arial" font-size="30" fill="#e2e8f0">- Improve security, cost control, and operational consistency</text>

  <rect x="78" y="710" width="1044" height="500" rx="16" fill="#111827" stroke="#38bdf8"/>
  <text x="112" y="776" font-family="Segoe UI, Arial" font-size="40" fill="#38bdf8" font-weight="800">Implementation Flow</text>
  <text x="112" y="834" font-family="Segoe UI, Arial" font-size="30" fill="#e5e7eb">1. Define enterprise policy requirements</text>
  <text x="112" y="884" font-family="Segoe UI, Arial" font-size="30" fill="#e5e7eb">2. Assign built-in or custom policy definitions</text>
  <text x="112" y="934" font-family="Segoe UI, Arial" font-size="30" fill="#e5e7eb">3. Scope assignments at management group or subscription</text>
  <text x="112" y="984" font-family="Segoe UI, Arial" font-size="30" fill="#e5e7eb">4. Configure remediation for existing drift</text>
  <text x="112" y="1034" font-family="Segoe UI, Arial" font-size="30" fill="#e5e7eb">5. Track compliance and exceptions over time</text>
  <text x="112" y="1084" font-family="Segoe UI, Arial" font-size="30" fill="#e5e7eb">6. Report trends to architecture and security leadership</text>

  <rect x="78" y="1242" width="1044" height="280" rx="16" fill="#1e3a8a"/>
  <text x="112" y="1308" font-family="Segoe UI, Arial" font-size="40" fill="#ffffff" font-weight="800">Professional Outcomes</text>
  <text x="112" y="1364" font-family="Segoe UI, Arial" font-size="30" fill="#eaf2ff">- Stronger security posture and compliance readiness</text>
  <text x="112" y="1414" font-family="Segoe UI, Arial" font-size="30" fill="#eaf2ff">- Faster audit response with centralized evidence</text>
  <text x="112" y="1464" font-family="Segoe UI, Arial" font-size="30" fill="#eaf2ff">- Consistent standards across all cloud environments</text>
</svg>
