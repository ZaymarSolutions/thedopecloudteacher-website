<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">Secure Azure DevOps CI/CD Pipeline</title>
  <desc id="desc">Poster visual for building secure Azure DevOps CI/CD pipeline with five phases.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="40%" stop-color="#0b376d"/>
      <stop offset="100%" stop-color="#2f1458"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1600" fill="url(#bg)"/>
  <image href="/logo.svg?v=20260704a" x="78" y="54" width="128" height="128"/>
  <text x="224" y="122" font-family="Segoe UI, Arial" font-size="46" fill="#ffffff" font-weight="700">TheDopeCloudTeacher.org</text>
  <text x="80" y="208" font-family="Segoe UI, Arial" font-size="88" fill="#ffffff" font-weight="900">BUILD A SECURE</text>
  <text x="80" y="292" font-family="Segoe UI, Arial" font-size="102" fill="#22d3ee" font-weight="900">AZURE DEVOPS</text>
  <text x="80" y="374" font-family="Segoe UI, Arial" font-size="104" fill="#fde047" font-weight="900">CI/CD PIPELINE</text>

  <g font-family="Segoe UI, Arial" fill="#f8fafc">
    <rect x="80" y="430" width="1040" height="162" rx="16" fill="#1e3a8a"/><text x="112" y="498" font-size="54" font-weight="900">1</text><text x="200" y="492" font-size="44" font-weight="800">Set up repository</text><text x="200" y="542" font-size="30">Create project, repo, branch protections, and PR checks.</text>
    <rect x="80" y="620" width="1040" height="162" rx="16" fill="#166534"/><text x="112" y="688" font-size="54" font-weight="900">2</text><text x="200" y="682" font-size="44" font-weight="800">Create build pipeline</text><text x="200" y="732" font-size="30">Trigger on push/PR, restore deps, build, test, publish artifacts.</text>
    <rect x="80" y="810" width="1040" height="162" rx="16" fill="#92400e"/><text x="112" y="878" font-size="54" font-weight="900">3</text><text x="200" y="872" font-size="44" font-weight="800">Add security scanning</text><text x="200" y="922" font-size="30">SAST, dependency scans, secrets checks, fail on high severity.</text>
    <rect x="80" y="1000" width="1040" height="162" rx="16" fill="#5b21b6"/><text x="112" y="1068" font-size="54" font-weight="900">4</text><text x="200" y="1062" font-size="44" font-weight="800">Deploy with controls</text><text x="200" y="1112" font-size="30">Use approvals, gated environments, and IaC release stages.</text>
    <rect x="80" y="1190" width="1040" height="162" rx="16" fill="#991b1b"/><text x="112" y="1258" font-size="54" font-weight="900">5</text><text x="200" y="1252" font-size="44" font-weight="800">Monitor and improve</text><text x="200" y="1302" font-size="30">Track failures, detect trends, and continuously harden controls.</text>
  </g>

  <rect x="80" y="1388" width="1040" height="152" rx="16" fill="#0f172a" stroke="#38bdf8"/>
  <text x="112" y="1450" font-family="Segoe UI, Arial" font-size="40" fill="#38bdf8" font-weight="800">Pro Tips</text>
  <text x="112" y="1506" font-family="Segoe UI, Arial" font-size="30" fill="#f8fafc">Automate everything, keep secrets out of code, test rollback strategy, and treat security as a delivery enabler.</text>
</svg>
